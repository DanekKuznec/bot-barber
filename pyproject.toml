[project]
name = "barber-bot"
version = "1.0.0"
description = "Booking bot for a barbershop: Telegram and VK, one shared schedule"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text in strings and comments is intentional

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
